<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Starfront Rush</title>
  <style>
    html, body { margin: 0; height: 100%; background: #04060c; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; color: #8fd8ff; }
    /* a phone-shaped 9:16 frame that fills the height on a computer and the whole screen on a phone */
    #frame { position: relative; height: 100vh; aspect-ratio: 9 / 16; max-width: 100vw; }
    @supports not (aspect-ratio: 9 / 16) { #frame { width: 56.25vh; } }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #04060c; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
    #title { font-size: 28px; letter-spacing: 6px; font-weight: 600; }
    #bar { width: 60%; height: 8px; border: 1px solid #3a8fd0; border-radius: 4px; overflow: hidden; }
    #fill { width: 0%; height: 100%; background: #6fd0ff; transition: width .2s; }
    #note { font-size: 13px; color: #5a7a96; }
    @media (max-aspect-ratio: 9/16) { #frame { width: 100vw; height: auto; } }
  </style>
</head>
<body>
  <div id="frame">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div id="title">STARFRONT RUSH</div>
      <div id="bar"><div id="fill"></div></div>
      <div id="note">loading...</div>
    </div>
  </div>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const fill = document.querySelector("#fill"), loading = document.querySelector("#loading"), note = document.querySelector("#note");
    const config = {
      dataUrl: "Build/Web.data.unityweb",
      frameworkUrl: "Build/Web.framework.js.unityweb",
      codeUrl: "Build/Web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Starfront Rush",
      productVersion: "0.1.0",
    };
    // GitHub refuses files over 100 MB, so a big data file is published in parts (Build/parts.json lists them):
    // fetch them in order and join them into one blob for the loader (no parts.json: the normal single file)
    async function dataInParts() {
      let parts;
      try { const r = await fetch("Build/parts.json", { cache: "no-cache" }); if (!r.ok) return false; parts = await r.json(); }
      catch (e) { return false; }
      const chunks = []; let got = 0;
      for (const name of parts.files) {
        const r = await fetch("Build/" + name, { cache: "no-cache" });
        if (!r.ok) throw new Error("missing " + name);
        const reader = r.body.getReader();
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value); got += value.length;
          fill.style.width = (80 * got / parts.size) + "%";
          note.textContent = "loading " + Math.round(100 * got / parts.size) + "%";
        }
      }
      config.dataUrl = URL.createObjectURL(new Blob(chunks));
      config.cacheControl = () => "no-store";   // the blob isn't a server file the loader's cache can check
      note.textContent = "starting...";
      return true;
    }
    const script = document.createElement("script");
    script.src = "Build/Web.loader.js";
    script.onload = async () => {
      let split = false;
      try { split = await dataInParts(); } catch (e) { note.textContent = "Couldn't load: " + e.message; return; }
      createUnityInstance(canvas, config, p => { fill.style.width = (split ? 80 + 20 * p : 100 * p) + "%"; })
        .then(() => { loading.style.display = "none"; })
        .catch(e => { note.textContent = "Couldn't start: " + e; });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
