<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Starfront Rush</title>
  <style>
    html, body { margin: 0; height: 100%; background: #04060c; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; color: #8fd8ff; }
    /* a phone-shaped 9:16 frame that fills the height on a computer and the whole screen on a phone */
    #frame { position: relative; height: 100vh; aspect-ratio: 9 / 16; max-width: 100vw; }
    @supports not (aspect-ratio: 9 / 16) { #frame { width: 56.25vh; } }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #04060c; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
    #title { font-size: 28px; letter-spacing: 6px; font-weight: 600; }
    #bar { width: 60%; height: 8px; border: 1px solid #3a8fd0; border-radius: 4px; overflow: hidden; }
    #fill { width: 0%; height: 100%; background: #6fd0ff; transition: width .2s; }
    #note { font-size: 13px; color: #5a7a96; }
    @media (max-aspect-ratio: 9/16) { #frame { width: 100vw; height: auto; } }
  </style>
</head>
<body>
  <div id="frame">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div id="title">STARFRONT RUSH</div>
      <div id="bar"><div id="fill"></div></div>
      <div id="note">loading...</div>
    </div>
  </div>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const fill = document.querySelector("#fill"), loading = document.querySelector("#loading"), note = document.querySelector("#note");
    // two builds: desktop textures (DXT, in Build/) and phone textures (ASTC, in BuildPhone/). A browser that can't draw
    // DXT but can draw ASTC (most phones) takes the phone build, so nothing has to be unpacked in full
    // which build this browser can draw: DXT (desktops) or ASTC (most phones). The test context is released after,
    // and a device with neither (or no WebGL 2) gets a warning instead of a crash later
    let OLD = false;
    const PHONE = (() => {
      try {
        const gl = document.createElement("canvas").getContext("webgl2");
        if (!gl) { OLD = true; return false; }
        const dxt = !!gl.getExtension("WEBGL_compressed_texture_s3tc");
        const astc = !!gl.getExtension("WEBGL_compressed_texture_astc");
        const lose = gl.getExtension("WEBGL_lose_context");
        if (lose) lose.loseContext();
        if (!dxt && !astc) OLD = true;
        return !dxt && astc;
      } catch (e) { return false; }
    })();
    const DIR = PHONE ? "BuildPhone/" : "Build/";
    const NAME = (f) => PHONE ? f.replace(/^Web\./, "WebPhone.") : f;
    const config = {
      dataUrl: DIR + NAME("Web.data.unityweb"),
      frameworkUrl: DIR + NAME("Web.framework.js.unityweb"),
      codeUrl: DIR + NAME("Web.wasm.unityweb"),
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Starfront Rush",
      productVersion: "0.1.0",
    };
    // GitHub refuses files over 100 MB, so the data is published in parts (<dir>/parts.json lists them, with sizes).
    // Each part comes from the browser's saved copy if it has one, else the network (retried on a flaky connection,
    // size-checked); the gzip is undone here as the parts arrive (the browser's own DecompressionStream), so the page
    // only ever holds the raw data once: far less memory on a phone than joining the gzip and letting Unity unpack it
    let VER = "";
    function show(got, total, saved) {
      fill.style.width = (80 * got / total) + "%";
      note.textContent = (saved ? "loading (saved) " : "loading ") + Math.round(100 * got / total) + "%";
    }
    async function readPart(r, size, base, total, saved) {
      const out = new Uint8Array(size); let at = 0;
      for (const rd = r.body.getReader(); ;) {
        const { done, value } = await rd.read();
        if (done) break;
        if (at + value.length > size) throw new Error("bad part size");
        out.set(value, at); at += value.length; show(base + at, total, saved);
      }
      if (at !== size) throw new Error("part cut short");
      return out;
    }
    async function getPart(name, size, base, total, cache) {
      const url = DIR + name;
      if (cache) {
        try { const hit = await cache.match(url); if (hit) return await readPart(hit, size, base, total, true); }
        catch (e) { try { await cache.delete(url); } catch (_) {} }
      }
      for (let tries = 0; ; tries++) {
        try {
          const r = await fetch(url);
          if (!r.ok) throw new Error(name + " " + r.status);
          const b = await readPart(r, size, base, total, false);
          if (cache) { try { await cache.put(url, new Response(b)); } catch (_) {} }
          return b;
        } catch (e) {
          if (tries >= 2) throw e;
          await new Promise(z => setTimeout(z, 1500 * (tries + 1)));
        }
      }
    }
    async function dataInParts() {
      let parts;
      try { const r = await fetch(DIR + "parts.json", { cache: "no-cache" }); if (!r.ok) return false; parts = await r.json(); }
      catch (e) { return false; }
      VER = parts.v || "";
      let cache = null;
      try { cache = await caches.open("starfront-data"); } catch (e) { cache = null; }
      if (cache) {
        try { for (const k of await cache.keys()) { const n = k.url.split("/").pop(); if (!parts.files.includes(n)) await cache.delete(k); } } catch (e) {}
        try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
      }
      const sizes = parts.sizes || [];
      const total = parts.size;
      if (typeof DecompressionStream !== "undefined" && sizes.length === parts.files.length) {
        const ds = new DecompressionStream("gzip"), w = ds.writable.getWriter();
        const out = (async () => {
          const blobs = []; let pend = [], n = 0;
          for (const rd = ds.readable.getReader(); ;) {
            const { done, value } = await rd.read();
            if (done) break;
            pend.push(value); n += value.length;
            if (n >= (8 << 20)) { blobs.push(new Blob(pend)); pend = []; n = 0; }
          }
          blobs.push(new Blob(pend));
          return new Blob(blobs);
        })();
        let base = 0;
        for (let i = 0; i < parts.files.length; i++) {
          await w.write(await getPart(parts.files[i], sizes[i], base, total, cache));
          base += sizes[i];
        }
        await w.close();
        config.dataUrl = URL.createObjectURL(await out);   // raw data: Unity takes it as it is
      } else {
        // older browsers: join the gzip and let Unity unpack it
        const chunks = []; let base = 0;
        for (let i = 0; i < parts.files.length; i++) {
          const size = sizes[i] || 0;
          let b;
          if (size) b = await getPart(parts.files[i], size, base, total, cache);
          else { const r = await fetch(DIR + parts.files[i]); if (!r.ok) throw new Error("missing " + parts.files[i]); b = new Uint8Array(await r.arrayBuffer()); }
          chunks.push(b); base += b.length; show(base, total, false);
        }
        config.dataUrl = URL.createObjectURL(new Blob(chunks));
      }
      config.cacheControl = () => "no-store";   // the blob isn't a server file the loader's cache can check
      // the code files carry the build's version, so a cached older framework never meets newer data
      if (VER) {
        config.frameworkUrl += "?v=" + VER;
        if (config.codeUrl) config.codeUrl += "?v=" + VER;
      }
      note.textContent = "starting...";
      return true;
    }
    const script = document.createElement("script");
    script.src = DIR + NAME("Web.loader.js");
    script.onload = async () => {
      let split = false;
      if (OLD) note.textContent = "This device may be too old for the game. Trying anyway...";
      try { split = await dataInParts(); } catch (e) { note.textContent = "Couldn't load: " + e.message; return; }
      const freeBlob = () => { if (split && config.dataUrl.startsWith("blob:")) URL.revokeObjectURL(config.dataUrl); };
      createUnityInstance(canvas, config, p => { fill.style.width = (split ? 80 + 20 * p : 100 * p) + "%"; })
        .then(() => { loading.style.display = "none"; freeBlob(); })
        .catch(e => { note.textContent = "Couldn't start: " + e; freeBlob(); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
